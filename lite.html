<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f0669a" />
  <title>Pingu 快捷</title>
  <link rel="stylesheet" href="lite.css" />
</head>
<body>
  <div class="lite-shell">
    <button type="button" class="lite-close" id="lite-close" aria-label="关闭">×</button>
    <p class="lite-label">今日</p>
    <p class="lite-count" id="lite-count">0</p>
    <button type="button" class="lite-pingu" id="lite-pingu" aria-label="显化一次">
      <img src="assets/pingu-sprite.png" alt="" draggable="false" />
      <span class="lite-fx" id="lite-fx" hidden>+1</span>
    </button>
    <p class="lite-hint">点首页形象 NOOT!</p>
  </div>
  <script src="lite.js"></script>
</body>
</html>
